name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write # mint the OIDC token for Sigstore signing (build provenance)
  attestations: write # persist the attestation to the repo's attestations API

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm run build

      # Build-provenance attestation for the release binaries (Obsidian review recommendation).
      # Binds main.js/styles.css to this CI build via Sigstore/OIDC, verifiable with
      # `gh attestation verify <file> -R <owner>/<repo>`. Only the GitHub-Actions build can attest
      # (no purely-local path); the /release skill's local `gh release create` is unaffected.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
